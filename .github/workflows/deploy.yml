name: DevSecOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # Checkout Code
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # SonarQube Scan
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Optional Quality Gate
      # Uncomment after Sonar scan is working
      #
      # - name: SonarQube Quality Gate
      #   uses: sonarsource/sonarqube-quality-gate-action@master
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Docker Login
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Docker Image
      - name: Build Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/nodejs-demo:${{ github.run_number }} .

      # Push Docker Image
      - name: Push Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/nodejs-demo:${{ github.run_number }}

      # Install Octopus CLI
      - name: Install Octopus CLI
        uses: OctopusDeploy/install-octopus-cli-action@v3

      # Verify Octopus CLI
      - name: Verify Octopus CLI
        run: |
          octopus version

      # Create Release
      - name: Create Octopus Release
        env:
          OCTOPUS_URL: ${{ secrets.OCTOPUS_SERVER }}
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_SPACE: ${{ secrets.OCTOPUS_SPACE }}
        run: |
          octopus release create \
            --project "NodeJS-App" \
            --version "${{ github.run_number }}"

      # Deploy Release
      - name: Deploy Octopus Release
        env:
          OCTOPUS_URL: ${{ secrets.OCTOPUS_SERVER }}
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_SPACE: ${{ secrets.OCTOPUS_SPACE }}
        run: |
          octopus release deploy \
            --project "NodeJS-App" \
            --version "${{ github.run_number }}" \
            --environment "dev"
