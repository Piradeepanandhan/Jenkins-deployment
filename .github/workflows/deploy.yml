name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Main

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t node-app:${{ github.sha }} .

      - name: Deploy to Linux Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22

          script: |

            cd /home/ubuntu

            if [ ! -d Jenkins-deployment ]; then
              git clone https://github.com/Piradeepanandhan/Jenkins-deployment.git
            fi

            cd Jenkins-deployment

            git pull origin main

            docker stop node-app || true
            docker rm node-app || true

            docker rmi node-app:latest || true

            docker build -t node-app:latest .

            docker run -d \
              --name node-app \
              -p 3000:3000 \
              --restart always \
              node-app:latest

            docker ps
